name: CI
on:
  push:
    paths-ignore: ['**/*.md', 'docs/**', 'scripts/capture-linux.py', 'LICENSE']
  pull_request:
    paths-ignore: ['**/*.md', 'docs/**', 'scripts/capture-linux.py', 'LICENSE']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Prepare Rust stable
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Record compiler
        run: rustc --version --verbose
      - uses: Swatinem/rust-cache@8cbdedb5103daa674dcf46d3590fe06a76645684 # v2.8.0
      - name: Format
        run: cargo fmt --all -- --check
      - name: Linux audio build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - name: Tests
        run: cargo test --locked --workspace
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Build Linux sample
        if: runner.os == 'Linux'
        run: cargo build --locked -p charon-sandbox -p charon-dialogue-sample
      - name: Build Windows sample
        if: runner.os == 'Windows'
        run: cargo build --locked --release -p charon-sandbox -p charon-dialogue-sample
      - name: Linux recorded input replay
        if: runner.os == 'Linux'
        run: |
          ./target/debug/charon-sandbox --replay docs/media/debugger-linux.trace --workers 1
          ./target/debug/charon-sandbox --replay docs/media/camera-linux.trace --workers 1
          ./target/debug/charon-sandbox --replay docs/media/placement-linux.trace --workers 1
          ./target/debug/charon-sandbox --replay docs/media/mining-linux.trace --workers 1
          ./target/debug/charon-sandbox --replay docs/media/lighting-linux.trace --workers 1
          ./target/debug/charon-sandbox --replay docs/media/sea-linux.trace --workers 1
          ./target/debug/charon-sandbox --replay docs/media/cup-linux.trace --workers 1
          ./target/debug/charon-sandbox --replay docs/media/fluid-dam-linux.trace --workers 1
      - name: Windows recorded input replay
        if: runner.os == 'Windows'
        run: |
          ./target/release/charon-sandbox.exe --replay docs/media/debugger-linux.trace --workers 1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./target/release/charon-sandbox.exe --replay docs/media/camera-linux.trace --workers 1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./target/release/charon-sandbox.exe --replay docs/media/placement-linux.trace --workers 1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./target/release/charon-sandbox.exe --replay docs/media/mining-linux.trace --workers 1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./target/release/charon-sandbox.exe --replay docs/media/lighting-linux.trace --workers 1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./target/release/charon-sandbox.exe --replay docs/media/sea-linux.trace --workers 1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./target/release/charon-sandbox.exe --replay docs/media/cup-linux.trace --workers 1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./target/release/charon-sandbox.exe --replay docs/media/fluid-dam-linux.trace --workers 1
      - name: Linux software Vulkan
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers xvfb
      - name: Linux fluid compute contracts
        if: runner.os == 'Linux'
        run: cargo test --locked -p charon-fluid --features gpu gpu_ -- --ignored --nocapture --test-threads=1
      - name: Linux lighting pixel contracts
        if: runner.os == 'Linux'
        run: cargo test --locked -p charon-render --test lighting_gpu -- --ignored --nocapture --test-threads=1
      - name: Linux offscreen shader check
        if: runner.os == 'Linux'
        run: ./target/debug/charon-sandbox --smoke --software --fluid-backend cpu --grid 65x66
      - name: Windows script and offscreen shader check
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/run.ps1 -Smoke -Software -FluidBackend cpu
      - name: Linux virtual-window smoke
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a -s "-screen 0 1920x1080x24 -extension MIT-SHM" ./target/debug/charon-sandbox --seconds 4 --record artifacts/local/window-metrics.csv
          python3 -c "from pathlib import Path; assert len(Path('artifacts/local/window-metrics.csv').read_text().splitlines()) >= 2"
      - name: Linux platformer window smoke
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a -s "-screen 0 1920x1080x24 -extension MIT-SHM" ./target/debug/charon-sandbox --play --seconds 3 --record artifacts/local/platformer.csv
          python3 -c "import csv; rows=list(csv.DictReader(open('artifacts/local/platformer.csv'))); assert rows and any(r['grounded']=='true' for r in rows); assert all(r['embedded']=='false' for r in rows)"
      - name: Linux dialogue window smoke
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a -s "-screen 0 1920x1080x24 -extension MIT-SHM" ./target/debug/charon-dialogue-sample --seconds 3 --record artifacts/local/dialogue.csv
          python3 -c "import csv; rows=list(csv.DictReader(open('artifacts/local/dialogue.csv'))); assert rows and rows[0]['page']=='Intro'"
      - name: Upload samples and validation records
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sandbox-${{ runner.os }}
          path: |
            target/debug/charon-sandbox
            target/debug/charon-dialogue-sample
            target/release/charon-sandbox.exe
            target/release/charon-dialogue-sample.exe
            artifacts/local/
            LICENSE
            samples/dialogue/assets/OFL.txt
          if-no-files-found: error
