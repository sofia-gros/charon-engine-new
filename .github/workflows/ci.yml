name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  build-test:
    name: ${{ matrix.os }} / stable
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Format
        run: cargo fmt --all -- --check
      - name: Core dependency boundary
        run: python scripts/check_core_dependencies.py
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Unit, integration, sample, and doc tests
        run: cargo test --locked --workspace
      - name: No-window sample
        run: cargo run --locked -p charon-m1-sample --no-default-features -- --smoke-test
      - name: Empty Core
        run: cargo run --locked -p charon-core --example empty
      - name: Release build
        env:
          RUSTFLAGS: ${{ runner.os == 'Windows' && '-D warnings -C target-feature=+crt-static' || '-D warnings' }}
        run: cargo build --locked --release --workspace
      - name: Windows executable smoke test
        if: runner.os == 'Windows'
        run: .\target\release\charon-m1-sample.exe --smoke-test
      - name: Package Windows 11 sample
        if: runner.os == 'Windows'
        run: python scripts/package_m1.py
      - name: Upload Windows 11 sample
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: charon-M1-win11-x64
          path: dist/m1/
          if-no-files-found: error
          retention-days: 30
