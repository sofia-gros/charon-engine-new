[package]
name = "charon-tracing-check"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
[dependencies]
charon_tracing_gpu = { path = "../../crates/charon_tracing_gpu", features = ["rtx","plugin"] }
charon_tracing = { path = "../../crates/charon_tracing" }
pollster = "0.4"

charon_render = {path="../../crates/charon_render",features=["gpu"]}
charon_lighting_render = {path="../../crates/charon_lighting_render"}
bytemuck = {version="1",features=["derive"]}
image = {version="0.25",default-features=false,features=["png"]}
