[workspace]
members = ["samples/m4-cave-light", "tools/charon-lighting-check", "crates/charon_lighting", "crates/charon_tilemap_lighting", "crates/charon_sand_lighting", "crates/charon_lighting_gpu", "crates/charon_lighting_render", "samples/m3-world-lab", "crates/charon_assets", "crates/charon_tilemap", "crates/charon_render", "crates/charon_tilemap_render", "crates/charon_sand_render", "crates/charon_bridge", ".", "crates/charon-core", "samples/m1-plugin-game", "crates/charon-sand", "samples/m2-sand-lab", "tools/charon-bench"]
resolver = "3"

[package]
name = "charon_physics"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "A headless 2D falling-sand simulation core in Rust"
repository = "https://github.com/sofia-gros/charon-engine-new"
readme = "README.md"
keywords = ["cellular-automaton", "falling-sand", "simulation", "rust"]
categories = ["graphics", "simulation", "game-development"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.bench]
opt-level = 3
lto = "thin"

[dependencies]
glam = "0.32.1"
rand = "0.10.1"

[dev-dependencies]
criterion = { version = "0.7", features = ["html_reports"] }

[[bench]]
name = "sim"
harness = false

[lib]
name = "charon_physics"
path = "src/lib.rs"
