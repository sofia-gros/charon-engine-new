[workspace]
members = ["engine/charon-save", "plugins/charon-audio", "plugins/charon-ui", "engine/charon-assets", "engine/charon-image", "engine/charon-runtime", "engine/charon-render", "plugins/charon-sand", "plugins/charon-dialogue", "plugins/charon-platformer", "plugins/charon-projectiles", "samples/sandbox", "samples/dialogue"]
default-members = ["engine/charon-runtime", "plugins/charon-sand", "plugins/charon-dialogue", "plugins/charon-platformer"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
charon-save = { path = "engine/charon-save" }
charon-audio = { path = "plugins/charon-audio" }
charon-ui = { path = "plugins/charon-ui" }
charon-assets = { path = "engine/charon-assets" }
charon-projectiles = { path = "plugins/charon-projectiles" }
charon-platformer = { path = "plugins/charon-platformer" }
charon-image = { path = "engine/charon-image" }
charon-runtime = { path = "engine/charon-runtime" }
charon-render = { path = "engine/charon-render" }
charon-dialogue = { path = "plugins/charon-dialogue" }
charon-sand = { path = "plugins/charon-sand" }
rayon = "1.11"
wgpu = { version = "30.0.1", default-features = false, features = ["std", "parking_lot", "vulkan", "dx12", "gles", "wgsl"] }
winit = { version = "0.30", default-features = false, features = ["rwh_06", "x11"] }
pollster = "0.4"

[profile.dev]
debug = 1
